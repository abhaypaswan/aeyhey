name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: SPDX headers
        run: pnpm check:spdx
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test

  build-community:
    name: Build with zero plugins
    # Keeps the public build honest: apps/web must build on its own,
    # with no hosted plugin present (PRD 23.6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert no plugins are registered, and that every interface has a default
        # Imports the real plugin list and builds a real registry, rather than grepping
        # the source for a pattern that a harmless refactor would break.
        run: pnpm vitest run apps/web/tests/community-build.test.ts
      - run: pnpm build
        env:
          EDITION: community

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aeyhey/web exec playwright install --with-deps chromium
      # The tests run against the production server, which needs a build first.
      - run: pnpm --filter @aeyhey/web build
      - run: pnpm test:e2e
        env:
          DEMO_MODE: "true"
          AI_PROVIDER: mock
