name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/abhaypaswan/aeyhey/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "abhaypaswan,dependabot[bot],renovate[bot],github-actions[bot]"
          custom-notsigned-prcomment: "Thanks for your pull request! Before we can merge it, please read the [Contributor License Agreement](https://github.com/abhaypaswan/aeyhey/blob/main/CLA.md) and sign it by posting the comment below. You only need to do this once."
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
