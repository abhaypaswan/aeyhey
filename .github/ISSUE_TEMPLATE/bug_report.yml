name: Bug report
description: Something is broken or does not work the way the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys or other secrets.
        For a security problem, use the Security tab instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste 3 links on the Add links screen
        2. Start a session
        3. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running Aeyhey
      options:
        - Docker Compose (SQLite, the default)
        - Docker Compose with Postgres
        - Docker Compose with Ollama
        - Demo mode
        - From source (pnpm dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or the git commit. /api/health reports it.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options:
        - None configured
        - OpenAI
        - An OpenAI-compatible endpoint
        - Anthropic
        - Ollama
        - Mock (demo)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output from the web or worker container. Remove anything secret.
      render: shell
