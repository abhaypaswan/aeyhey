name: Question
description: Ask how something works or how to set it up
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        If Discussions is enabled on this repo, a question often fits better there.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you have tried and how you are running Aeyhey
